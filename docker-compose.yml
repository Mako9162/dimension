services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taller
      POSTGRES_PASSWORD: taller_local
      POSTGRES_DB: cotizaciones
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - cotizaciones_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taller -d cotizaciones"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  cotizaciones_data:
